<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 71, 126, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
            width: 85%;
            max-width: 400px;
        }
        .main-heart {
            font-size: 60px;
            color: #ff477e;
            animation: pulse 1.2s infinite alternate ease-in-out;
            display: inline-block;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            to { transform: scale(1.25); filter: drop-shadow(0 0 15px #ff477e); }
        }
        h1 {
            color: #ff477e;
            font-size: 2.2rem;
            margin: 10px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 25px;
            border-right: 2px solid #ff477e;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            animation: typing 3.5s steps(30, end) infinite alternate;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        .counter-box {
            background: linear-gradient(135deg, #ff477e, #ff7096);
            color: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.3);
            margin-bottom: 20px;
        }
        .days-number {
            font-size: 2.8rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .days-label {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }
        .music-btn {
            background: white;
            border: 2px solid #ff477e;
            color: #ff477e;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .music-btn:hover {
            background: #ff477e;
            color: white;
            transform: scale(1.05);
        }
        .floating-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.45);
            animation: floatUp linear infinite;
            bottom: -50px;
            user-select: none;
            pointer-events: none;
        }
        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="pari.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="main-heart">❤️</div>
        <h1>Ziyad & Pari</h1>
        <div class="subtitle">تۆ جوانترین ڕووداوی ژیانی منیت...</div>
        
        <div class="counter-box">
            <span class="days-number">146</span>
            <span class="days-label">ڕۆژ پێکەوەین</span>
        </div>

        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 لێدانی مۆسیقا</button>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => {
                    btn.innerHTML = '⏸️ ڕاگرتنی مۆسیقا';
                    btn.style.background = '#ff477e';
                    btn.style.color = 'white';
                }).catch(err => {
                    console.log("Play blocked, retrying...", err);
                    setTimeout(() => {
                        music.play();
                        btn.innerHTML = '⏸️ ڕاگرتنی مۆسیقا';
                        btn.style.background = '#ff477e';
                        btn.style.color = 'white';
                    }, 100);
                });
            } else {
                music.pause();
                btn.innerHTML = '🎵 لێدانی مۆسیقا';
                btn.style.background = 'white';
                btn.style.color = '#ff477e';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 12 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 350);
    </script>
</body>
</html>
